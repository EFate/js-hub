<svg viewBox="0 0 680 840" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>video-interface-redesign 分层架构图</title>
  <desc>L1-L7 分层：配置、基础设施、站点识别、网络防线、清理与重组、控制面板、装配启动</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">video-interface-redesign.js · 分层架构</text>
  <g stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4" fill="none">
    <rect x="40" y="46" width="600" height="72" rx="10"/>
    <rect x="40" y="152" width="600" height="72" rx="10"/>
    <rect x="40" y="258" width="600" height="84" rx="10"/>
    <rect x="40" y="376" width="600" height="72" rx="10"/>
    <rect x="40" y="482" width="600" height="84" rx="10"/>
    <rect x="40" y="600" width="600" height="72" rx="10"/>
    <rect x="40" y="706" width="600" height="72" rx="10"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#888780">
    <text x="48" y="62">L1 CONFIG 配置中心</text>
    <text x="48" y="168">L2 FOUNDATION 基础设施</text>
    <text x="48" y="274">L3 DETECT 站点识别</text>
    <text x="48" y="392">L4 NETGUARD 网络防线</text>
    <text x="48" y="498">L5 CLEAN 清理与重组</text>
    <text x="48" y="616">L6 VIEW 控制面板</text>
    <text x="48" y="722">L7 BOOTSTRAP 装配启动</text>
  </g>
  <g fill="#444441" stroke="#B4B2A9" stroke-width="0.5">
    <rect x="52" y="72" width="576" height="38" rx="8"/>
  </g>
  <text x="340" y="91" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#D3D1C7">检测签名表 · 广告模式规则 · 重组样式参数 · 存储键（开关 / 强度 / 豁免 / 统计）</text>
  <g fill="#0C447C" stroke="#85B7EB" stroke-width="0.5">
    <rect x="52" y="178" width="282" height="38" rx="8"/>
    <rect x="346" y="178" width="282" height="38" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B5D4F4">
    <text x="193" y="197" dominant-baseline="central">Utils（选择器 · 防抖 · 日志）</text>
    <text x="487" y="197" dominant-baseline="central">Store（GM 读写 · 豁免域 · 统计）</text>
  </g>
  <g fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5">
    <rect x="52" y="284" width="184" height="48" rx="8"/>
    <rect x="248" y="284" width="184" height="48" rx="8"/>
    <rect x="444" y="284" width="184" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif">
    <text x="144" y="301" dominant-baseline="central" font-size="13" fill="#CECBF6">指纹评分</text>
    <text x="144" y="319" dominant-baseline="central" font-size="12" fill="#AFA9EC">标题·分类·排行·卡片</text>
    <text x="340" y="301" dominant-baseline="central" font-size="13" fill="#CECBF6">阈值判定</text>
    <text x="340" y="319" dominant-baseline="central" font-size="12" fill="#AFA9EC">达标激活，否则零开销</text>
    <text x="536" y="301" dominant-baseline="central" font-size="13" fill="#CECBF6">结果缓存</text>
    <text x="536" y="319" dominant-baseline="central" font-size="12" fill="#AFA9EC">每域名判定一次</text>
  </g>
  <g fill="#791F1F" stroke="#F09595" stroke-width="0.5">
    <rect x="52" y="402" width="282" height="38" rx="8"/>
    <rect x="346" y="402" width="282" height="38" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F7C1C1">
    <text x="193" y="421" dominant-baseline="central">window.open 弹窗拦截</text>
    <text x="487" y="421" dominant-baseline="central">script / iframe 注入拦截</text>
  </g>
  <g fill="#085041" stroke="#5DCAA5" stroke-width="0.5">
    <rect x="52" y="508" width="282" height="48" rx="8"/>
    <rect x="346" y="508" width="282" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif">
    <text x="193" y="525" dominant-baseline="central" font-size="13" fill="#9FE1CB">AdSweeper 广告清扫</text>
    <text x="193" y="543" dominant-baseline="central" font-size="12" fill="#5DCAA5">悬浮启发式 · 防回弹监听</text>
    <text x="487" y="525" dominant-baseline="central" font-size="13" fill="#9FE1CB">LayoutEngine 界面重组</text>
    <text x="487" y="543" dominant-baseline="central" font-size="12" fill="#5DCAA5">分类折叠·搜索置顶·栅格规整</text>
  </g>
  <g fill="#633806" stroke="#EF9F27" stroke-width="0.5">
    <rect x="52" y="626" width="184" height="38" rx="8"/>
    <rect x="248" y="626" width="184" height="38" rx="8"/>
    <rect x="444" y="626" width="184" height="38" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FAC775">
    <text x="144" y="645" dominant-baseline="central">FloatButton 悬浮球</text>
    <text x="340" y="645" dominant-baseline="central">Panel 状态与开关</text>
    <text x="536" y="645" dominant-baseline="central">Toast 轻提示</text>
  </g>
  <g fill="#712B13" stroke="#F0997B" stroke-width="0.5">
    <rect x="52" y="732" width="184" height="38" rx="8"/>
    <rect x="248" y="732" width="184" height="38" rx="8"/>
    <rect x="444" y="732" width="184" height="38" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F5C4B3">
    <text x="144" y="751" dominant-baseline="central">装配启动</text>
    <text x="340" y="751" dominant-baseline="central">Watcher 重扫</text>
    <text x="536" y="751" dominant-baseline="central">油猴菜单</text>
  </g>
  <g stroke="#888780" stroke-width="1.5" fill="none">
    <line x1="340" y1="118" x2="340" y2="152" marker-end="url(#arrow)"/>
    <line x1="340" y1="224" x2="340" y2="258" marker-end="url(#arrow)"/>
    <line x1="340" y1="342" x2="340" y2="376" marker-end="url(#arrow)"/>
    <line x1="340" y1="448" x2="340" y2="482" marker-end="url(#arrow)"/>
    <line x1="340" y1="566" x2="340" y2="600" marker-end="url(#arrow)"/>
    <line x1="340" y1="672" x2="340" y2="706" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="806" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">虚线框 = 分层边界（依赖自上而下单向）　箭头 = 调用方向　颜色 = 层职责</text>
</svg>
