<svg viewBox="0 0 680 1140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .layer { fill: none; stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .layer-title { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
      .node { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .nt { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .nd { font-family: sans-serif; font-size: 10.5px; fill: #64748b; }
      .arrow { stroke: #94a3b8; stroke-width: 1.3; fill: none; }
      .band { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .band-t { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #047857; }
      .band-d { font-family: sans-serif; font-size: 11px; fill: #10b981; }
      .warn { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .warn-t { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #92400e; }
      .warn-d { font-family: sans-serif; font-size: 10.5px; fill: #b45309; }
      .h1 { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .h2 { font-family: sans-serif; font-size: 11.5px; fill: #64748b; }
      .note { font-family: sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="24" y="26" class="h1">zhihu-enhance v1.1.0 · 知乎阅读增强助手 · 七层架构</text>
  <text x="24" y="45" class="h2">零依赖 · 零网络请求 · 零注入（管理器菜单是唯一入口）· 11 个开关 / 4 组分类</text>

  <!-- L1 配置层 -->
  <rect x="24" y="60" width="632" height="112" rx="12" class="layer"/>
  <text x="40" y="82" class="layer-title">L1 配置层 · 一切开关的定义点</text>

  <rect x="40" y="94" width="186" height="62" rx="8" class="node"/>
  <text x="133" y="115" class="nt" text-anchor="middle">UserScript Meta 六件套</text>
  <text x="133" y="133" class="nd" text-anchor="middle">name / namespace / version</text>
  <text x="133" y="148" class="nd" text-anchor="middle">author / license / updateURL</text>

  <rect x="238" y="94" width="186" height="62" rx="8" class="band"/>
  <text x="331" y="115" class="band-t" text-anchor="middle">OPT_DEFS 选项定义表</text>
  <text x="331" y="133" class="band-d" text-anchor="middle">11 开关 · 四组分类</text>
  <text x="331" y="148" class="band-d" text-anchor="middle">label/默认值/分组</text>

  <rect x="436" y="94" width="204" height="62" rx="8" class="node"/>
  <text x="538" y="115" class="nt" text-anchor="middle">存储键约定 zh.*</text>
  <text x="538" y="133" class="nd" text-anchor="middle">zh.&lt;开关名&gt; 布尔值</text>
  <text x="538" y="148" class="nd" text-anchor="middle">GM_getValue / GM_setValue</text>

  <line x1="340" y1="172" x2="340" y2="192" class="arrow" marker-end="url(#ar)"/>

  <!-- L2 数据结构层 -->
  <rect x="24" y="196" width="632" height="96" rx="12" class="layer"/>
  <text x="40" y="218" class="layer-title">L2 数据结构层 · 单一数据源</text>

  <rect x="40" y="230" width="286" height="46" rx="8" class="band"/>
  <text x="183" y="250" class="band-t" text-anchor="middle">OPT 设置对象</text>
  <text x="183" y="268" class="band-d" text-anchor="middle">loadOpts() → OPT → saveOpt()</text>

  <rect x="338" y="230" width="302" height="46" rx="8" class="node"/>
  <text x="489" y="250" class="nt" text-anchor="middle">缺失键自动补默认值</text>
  <text x="489" y="268" class="nd" text-anchor="middle">新增开关零迁移成本；无旧键兼容负担</text>

  <line x1="340" y1="292" x2="340" y2="312" class="arrow" marker-end="url(#ar)"/>

  <!-- L3 样式层 -->
  <rect x="24" y="316" width="632" height="112" rx="12" class="layer"/>
  <text x="40" y="338" class="layer-title">L3 样式层 · CSS 按开关拼装，改设置即时生效免刷新</text>

  <rect x="40" y="350" width="186" height="62" rx="8" class="node"/>
  <text x="133" y="371" class="nt" text-anchor="middle">净化 CSS</text>
  <text x="133" y="389" class="nd" text-anchor="middle">登录弹窗 / 侧边栏居中</text>
  <text x="133" y="404" class="nd" text-anchor="middle">顶栏滚动隐藏</text>

  <rect x="238" y="350" width="186" height="62" rx="8" class="node"/>
  <text x="331" y="371" class="nt" text-anchor="middle">阅读 CSS</text>
  <text x="331" y="389" class="nd" text-anchor="middle">图片限高 / 悬停聚焦</text>
  <text x="331" y="404" class="nd" text-anchor="middle">引用角标高亮</text>

  <rect x="436" y="350" width="204" height="62" rx="8" class="warn"/>
  <text x="538" y="371" class="warn-t" text-anchor="middle">夜间主题 CSS（常驻）</text>
  <text x="538" y="389" class="warn-d" text-anchor="middle">常驻</text>
  <text x="538" y="404" class="warn-d" text-anchor="middle">data-theme 属性门控</text>

  <line x1="340" y1="428" x2="340" y2="448" class="arrow" marker-end="url(#ar)"/>

  <!-- L4 核心逻辑层 -->
  <rect x="24" y="452" width="632" height="150" rx="12" class="layer"/>
  <text x="40" y="474" class="layer-title">L4 核心逻辑层 · 纯函数，全部 UMD 导出供测试 require</text>

  <rect x="40" y="486" width="192" height="98" rx="8" class="band"/>
  <text x="136" y="507" class="band-t" text-anchor="middle">resolveLink()</text>
  <text x="136" y="526" class="nd" text-anchor="middle">target= / next= 参数</text>
  <text x="136" y="541" class="nd" text-anchor="middle">优先取编码 URL 解码</text>
  <text x="136" y="556" class="nd" text-anchor="middle">编码片段兜底</text>
  <text x="136" y="571" class="nd" text-anchor="middle">仅放行 http(s) 外链</text>

  <rect x="244" y="486" width="192" height="98" rx="8" class="node"/>
  <text x="340" y="507" class="nt" text-anchor="middle">normalizeImg()</text>
  <text x="340" y="526" class="nd" text-anchor="middle">zhimg.com 尺寸后缀白名单</text>
  <text x="340" y="541" class="nd" text-anchor="middle">_XS/_S/_M/_L/_XL/_HD/_R/_B</text>
  <text x="340" y="556" class="nd" text-anchor="middle">非白名单后缀一律不动</text>
  <text x="340" y="571" class="nd" text-anchor="middle">重复调用原样返回（幂等）</text>

  <rect x="448" y="486" width="192" height="98" rx="8" class="node"/>
  <text x="544" y="507" class="nt" text-anchor="middle">pickTime()</text>
  <text x="544" y="526" class="nd" text-anchor="middle">从 data-tooltip 提取</text>
  <text x="544" y="541" class="nd" text-anchor="middle">「发布于 / 编辑于」绝对时间</text>
  <text x="544" y="556" class="nd" text-anchor="middle">只有「编辑于」时补发布时间</text>
  <text x="544" y="571" class="nd" text-anchor="middle">取不到返回 null 不硬造</text>

  <line x1="340" y1="602" x2="340" y2="622" class="arrow" marker-end="url(#ar)"/>

  <!-- L5 执行层 -->
  <rect x="24" y="626" width="632" height="150" rx="12" class="layer"/>
  <text x="40" y="648" class="layer-title">L5 执行层 · DOM 动作，全部带 data-zhx 幂等标记</text>

  <rect x="40" y="660" width="142" height="98" rx="8" class="node"/>
  <text x="111" y="681" class="nt" text-anchor="middle">applyLink</text>
  <text x="111" y="700" class="nd" text-anchor="middle">改写 href 直链化</text>
  <text x="111" y="715" class="nd" text-anchor="middle">已处理跳过</text>
  <text x="111" y="730" class="nd" text-anchor="middle">知乎站内链不动</text>
  <text x="111" y="745" class="nd" text-anchor="middle">计数用于去抖节流</text>

  <rect x="194" y="660" width="142" height="98" rx="8" class="node"/>
  <text x="265" y="681" class="nt" text-anchor="middle">applyTime</text>
  <text x="265" y="700" class="nd" text-anchor="middle">发布时间移至卡片顶部</text>
  <text x="265" y="715" class="nd" text-anchor="middle">移动前先摘旧位</text>
  <text x="265" y="730" class="nd" text-anchor="middle">避免 React 重渲染错位</text>
  <text x="265" y="745" class="nd" text-anchor="middle">无时间戳不显示</text>

  <rect x="348" y="660" width="142" height="98" rx="8" class="node"/>
  <text x="419" y="681" class="nt" text-anchor="middle">applyImg</text>
  <text x="419" y="700" class="nd" text-anchor="middle">src 与 data-actualsrc</text>
  <text x="419" y="715" class="nd" text-anchor="middle">同步替换原图</text>
  <text x="419" y="730" class="nd" text-anchor="middle">懒加载占位图同样覆盖</text>
  <text x="419" y="745" class="nd" text-anchor="middle">替换失败回退原 src</text>

  <rect x="502" y="660" width="138" height="98" rx="8" class="node"/>
  <text x="571" y="681" class="nt" text-anchor="middle">toggleNight</text>
  <text x="571" y="700" class="nd" text-anchor="middle">翻写 html data-theme</text>
  <text x="571" y="715" class="nd" text-anchor="middle">即时生效免刷新</text>
  <text x="571" y="730" class="nd" text-anchor="middle">playGifs 点击播放</text>
  <text x="571" y="745" class="nd" text-anchor="middle">cleanSticky 兜底清理</text>

  <line x1="340" y1="776" x2="340" y2="796" class="arrow" marker-end="url(#ar)"/>

  <!-- L6 UI 层 -->
  <rect x="24" y="800" width="632" height="120" rx="12" class="layer"/>
  <text x="40" y="822" class="layer-title">L6 UI 层 · ghb 设计系统（zhx- 前缀），懒挂载零残留</text>

  <rect x="40" y="834" width="192" height="70" rx="8" class="band"/>
  <text x="136" y="855" class="band-t" text-anchor="middle">设置面板</text>
  <text x="136" y="873" class="band-d" text-anchor="middle">4 组分区 + 开关行</text>
  <text x="136" y="888" class="band-d" text-anchor="middle">首次挂载 · Esc/遮罩</text>

  <rect x="244" y="834" width="192" height="70" rx="8" class="warn"/>
  <text x="340" y="855" class="warn-t" text-anchor="middle">GM 菜单（唯一入口）</text>
  <text x="340" y="873" class="warn-d" text-anchor="middle">⚙ 设置面板</text>
  <text x="340" y="888" class="warn-d" text-anchor="middle">夜间 开/关 · 即时切</text>

  <rect x="448" y="834" width="192" height="70" rx="8" class="node"/>
  <text x="544" y="855" class="nt" text-anchor="middle">Toast 反馈</text>
  <text x="544" y="873" class="nd" text-anchor="middle">仅在菜单切换开关时弹出</text>
  <text x="544" y="888" class="nd" text-anchor="middle">改动即时生效</text>

  <line x1="340" y1="920" x2="340" y2="940" class="arrow" marker-end="url(#ar)"/>

  <!-- L7 Watcher 层 -->
  <rect x="24" y="944" width="632" height="130" rx="12" class="layer"/>
  <text x="40" y="966" class="layer-title">L7 Watcher 层 · 唯一的监听者（其余层只消费它的事件）</text>

  <rect x="40" y="978" width="192" height="78" rx="8" class="node"/>
  <text x="136" y="999" class="nt" text-anchor="middle">MutationObserver</text>
  <text x="136" y="1017" class="nd" text-anchor="middle">去抖 200ms 合并变更</text>
  <text x="136" y="1032" class="nd" text-anchor="middle">触发动态任务：直链 / 时间 / 原图</text>
  <text x="136" y="1047" class="nd" text-anchor="middle">变更加执行计数，无变化不空转</text>

  <rect x="244" y="978" width="192" height="78" rx="8" class="node"/>
  <text x="340" y="999" class="nt" text-anchor="middle">watchScroll（节流 120ms）</text>
  <text x="340" y="1017" class="nd" text-anchor="middle">下滚 &gt; 80px 隐藏顶栏</text>
  <text x="340" y="1032" class="nd" text-anchor="middle">上滚或回到顶部恢复</text>
  <text x="340" y="1047" class="nd" text-anchor="middle">随开关挂载 / 卸载监听</text>

  <rect x="448" y="978" width="192" height="78" rx="8" class="warn"/>
  <text x="544" y="999" class="warn-t" text-anchor="middle">data-theme 守护</text>
  <text x="544" y="1017" class="warn-d" text-anchor="middle">开启时监听 html 属性</text>
  <text x="544" y="1032" class="warn-d" text-anchor="middle">被站点重置则立即写回</text>
  <text x="544" y="1047" class="warn-d" text-anchor="middle">零轮询，仅属性过滤</text>

  <text x="24" y="1102" class="note">注：零注入判据 —— 全部功能自动生效或经菜单触发，页面上没有任何需要用户点一下的动作，故不注入任何入口器件；</text>
  <text x="24" y="1120" class="note">夜间主题 CSS 常驻但由 data-theme 属性门控，不注入任何可见 UI。设置与开关的唯一入口是脚本管理器菜单。</text>
</svg>
