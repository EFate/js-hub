<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" role="img">
  <title>github-accelerate.js 分层架构图</title>
  <desc>七层架构：双节点接口源、网络层、状态层、能力层、视图层、配置与启动层，附四级下载链路</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="58" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">github-accelerate.js · 分层架构</text>
  <text x="40" y="78" font-family="sans-serif" font-size="12" fill="#5F5E5A">双节点源 · 脚本只管「发射」 · 浏览器原生通道 · Gopeed 浏览器扩展接管 · 作者 EFate</text>

  <g font-family="sans-serif">
    <rect x="40" y="96" width="188" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="134" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">api.akams.cn/github</text>
    <text x="134" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">{code, data:[{url, speed}]}</text>

    <rect x="246" y="96" width="188" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">git.mxg.pub/api/github/list</text>
    <text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">{data:[{url, status, latency}]}</text>

    <rect x="452" y="96" width="188" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="546" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">内置镜像清单</text>
    <text x="546" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">接口全挂时并发测速兜底</text>
  </g>

  <path d="M134 144L134 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 144L340 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M546 144L546 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="168" width="600" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="196" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L3 · NETWORK</text>
  <text x="170" y="188" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">gmRequest 封装 · 双格式解析器 parseAkams / parseMxg</text>
  <text x="170" y="208" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">节点源依次降级 · 接口全挂回落并发测速 · 8 路探测</text>

  <rect x="40" y="234" width="600" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="262" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L4 · STATE</text>
  <text x="170" y="254" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">NodeStore 单一数据源 · visible 勾选 · fails 健康度 · lastOk 新鲜度（持久化）</text>
  <text x="170" y="274" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">candidates / freshCandidates · markOk / markOkMany（批量写盘）· 变更广播驱动视图重绘</text>

  <rect x="40" y="300" width="600" height="92" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="346" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L5 · CAPABILITY</text>
  <rect x="170" y="310" width="224" height="72" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="282" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">Downloader 直链交付（不接管下载）</text>
  <text x="282" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">fast-path: fresh 候选(5min 内预检过)直接 fire 0ms</text>
  <text x="282" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">慢路径: 短预检 2.5s + a[download] 原生触发 · Gopeed 可接管</text>
  <text x="282" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-family="sans-serif">runAuto：预检失败自动换镜像轮转</text>
  <rect x="410" y="310" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="518" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">Injector 场景注入</text>
  <text x="518" y="346" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">9 条 SCENARIOS 规则表</text>
  <text x="518" y="362" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">防抖注入 + 兜底轮询</text>
  <text x="518" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Release / Raw / Archive 覆盖</text>

  <rect x="40" y="402" width="600" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="430" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L6 · VIEW</text>
  <text x="170" y="422" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">View.download 统一入口 · askNode 分流（弹窗手选 / 全自动）</text>
  <text x="170" y="442" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Launcher 右侧居中 · Panel 三页签 · DlModal 选节点 · Toast 延迟 150ms（fast-path 不闪烁）</text>

  <rect x="40" y="468" width="292" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="486" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L2 · FOUNDATION</text>
  <text x="56" y="504" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Utils · Log · Store · Icons（内联 SVG）</text>
  <rect x="348" y="468" width="292" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="364" y="486" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L1 · CONFIG</text>
  <text x="364" y="504" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">SCENARIOS · DEFAULT_SETTINGS (含 showPageButtons) · K · NODES_APIS 双源</text>

  <rect x="40" y="526" width="600" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="546" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L7 · BOOTSTRAP</text>
  <text x="200" y="542" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">初始化 · 油猴菜单注册 · showPageButtons 守卫 → Injector.start</text>
  <text x="200" y="560" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">页面内镜像按钮主开关：关则完全不注入，只能用启动器手动开弹窗</text>

  <rect x="40" y="578" width="600" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="56" y="596" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">下载链路（纯直链 · 脚本不接管下载）</text>
  <text x="318" y="596" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">fresh 候选命中(预检过 ≤ 5min) → 0ms 直发浏览器；无 fresh → 短预检 2.5s；预检失败 → 换下一镜像；轮转耗尽 → 对最快节点直接放行</text>

  <g font-family="sans-serif">
    <rect x="56" y="606" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="120" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">① 挑选镜像</text>
    <text x="120" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">健康度排序 · 延迟优先</text>
    <rect x="206" y="606" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="270" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">② HEAD 预检</text>
    <text x="270" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">失败换下一镜像</text>
    <rect x="356" y="606" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="422" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">③ 原生直链</text>
    <text x="422" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">a[download] 点击触发</text>
    <rect x="510" y="606" width="114" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="567" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">④ 浏览器/Gopeed</text>
    <text x="567" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">原生通道接管下载</text>
    <path d="M188 628L202 628" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M338 628L352 628" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M492 628L506 628" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="197" y="613" text-anchor="middle" font-size="11" fill="#0F6E56">通过</text>
    <text x="347" y="613" text-anchor="middle" font-size="11" fill="#0F6E56">通过</text>
    <text x="501" y="613" text-anchor="middle" font-size="11" fill="#0F6E56">交付</text>
    <text x="131" y="664" text-anchor="middle" font-size="11" fill="#085041" font-weight="500">↑ 预检失败自动换下一个镜像（健康度记账）；轮转耗尽 → 对最快节点直接放行</text>
  </g>

  <rect x="40" y="678" width="600" height="92" rx="10" fill="#FBF5EA" stroke="#C58A2E" stroke-width="0.5"/>
  <text x="56" y="700" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#7A4A12">职责边界 · 三方各自管什么</text>
  <text x="56" y="720" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#7A4A12">脚本只管「发射」直链，下载事件由浏览器原生通道交给默认下载器或 Gopeed 浏览器扩展，脚本不接管下载。</text>

  <g font-family="sans-serif">
    <rect x="56" y="734" width="148" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="130" y="748" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">① 脚本（this）</text>
    <text x="130" y="762" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">挑镜像 · HEAD 预检 · a[download]</text>

    <path d="M204 748L246 748" fill="none" stroke="#C58A2E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="225" y="738" text-anchor="middle" font-size="11" fill="#7A4A12">原生点击</text>

    <rect x="248" y="734" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="334" y="748" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">② 浏览器原生通道</text>
    <text x="334" y="762" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">下载事件（chrome.downloads）</text>

    <path d="M420 748L462 748" fill="none" stroke="#C58A2E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="441" y="738" text-anchor="middle" font-size="11" fill="#7A4A12">拦截</text>

    <rect x="464" y="734" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="544" y="748" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">③ Gopeed 浏览器扩展</text>
    <text x="544" y="762" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">chrome.downloads 拦截后接管</text>
  </g>

</svg>
