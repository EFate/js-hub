<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1040" width="700" role="img">
  <title>github-accelerate.js v1.0.0 分层架构图</title>
  <desc>七层架构自上而下：L7 启动 → L6 视图 → L5 能力(含 L5-c Enhancer) → L4 状态 → 外部数据源 → L3 网络 → L2 基础(含 L2-b Arch) → L1 配置。纯直链交付、内置 Release 增强显示。上层调用下层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1B8A6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A978F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">github-accelerate.js · 分层架构（v1.0.0）</text>
  <text x="40" y="58" font-family="sans-serif" font-size="12" fill="#5F5E5A">双节点源 · 脚本只管「发射」 · 浏览器原生通道 · Gopeed 接管 · 内置 Release 增强显示 · 作者 EFate</text>

  <!-- 图例 -->
  <g font-family="sans-serif" font-size="11" fill="#5F5E5A">
    <rect x="470" y="28" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="490" y="39" dominant-baseline="central">既有运行时层</text>
    <rect x="470" y="46" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1B8A6B" stroke-width="0.5"/>
    <text x="490" y="57" dominant-baseline="central">v1.0.0 新增</text>
    <rect x="572" y="28" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="592" y="39" dominant-baseline="central">配置/基础/启动</text>
    <line x1="572" y1="53" x2="586" y2="53" stroke="#9A978F" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="592" y="57" dominant-baseline="central">上层调用下层</text>
  </g>

  <!-- 左侧调用方向箭头 -->
  <line x1="24" y1="92" x2="24" y2="724" stroke="#9A978F" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="24" y="412" font-family="sans-serif" font-size="10" fill="#9A978F" text-anchor="middle" transform="rotate(-90 24 412)">调用方向：上层 → 下层</text>

  <!-- L7 BOOTSTRAP -->
  <rect x="44" y="74" width="612" height="58" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="60" y="98" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L7 · BOOTSTRAP（启动 / 入口）</text>
  <text x="220" y="94" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">页面加载即运行 · 注册油猴菜单 · showPageButtons 守卫 → Injector.start</text>
  <text x="220" y="112" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#1B8A6B">★ 菜单新增：增强·分组排序 / 下载量 / 精确时间 / 折叠日志　末尾调用 Enhancer.init()</text>

  <!-- L6 VIEW -->
  <rect x="44" y="142" width="612" height="66" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="166" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L6 · VIEW（界面 / 交互）</text>
  <text x="220" y="162" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Launcher 右侧居中可拖拽 · Panel 四页签(节点 / 注入 / 偏好 / ★增强) · DlModal 选节点 · Toast</text>
  <text x="220" y="180" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">增强样式：分组着色 · 平台标签 · OS/架构下拉 · 下载量徽标 · 日志折叠 · 架构说明弹窗</text>
  <text x="220" y="198" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#1B8A6B">★ 增强页签：四个开关即时生效（改动写盘 + Enhancer.scan 重扫）</text>

  <!-- L5 CAPABILITY -->
  <rect x="44" y="218" width="612" height="196" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="242" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L5 · CAPABILITY（能力 / 功能）</text>

  <rect x="174" y="228" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="274" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">Downloader 直链交付</text>
  <text x="274" y="264" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">fresh 候选(≤5min)→ 0ms 直发</text>
  <text x="274" y="280" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">慢路径：短预检 2.5s + a[download]</text>
  <text x="274" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">runAuto：预检失败自动换镜像</text>

  <rect x="414" y="228" width="216" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="522" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">Injector 场景注入</text>
  <text x="522" y="264" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">9 条 SCENARIOS 规则表</text>
  <text x="522" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">防抖注入 + 兜底轮询</text>
  <text x="522" y="296" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">Release / Raw / Archive 覆盖</text>

  <!-- L5-c Enhancer (NEW) -->
  <rect x="174" y="318" width="456" height="88" rx="8" fill="#E1F5EE" stroke="#1B8A6B" stroke-width="1"/>
  <text x="190" y="338" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#085041">L5-c · CAPABILITY · Enhancer（★ 新增 · Release 增强显示）</text>
  <text x="190" y="356" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">四大能力(可独立开关)：groupSort 分组排序 · downloadCount 下载量 · replaceTime 精确时间 · collapsibleNotes 折叠日志</text>
  <text x="190" y="374" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">scan · init(MutationObserver + turbo:load/pjax:end) · injectControls · formatAndSort · injectCounts(fetchCounts via API) · showArchHelp</text>
  <text x="190" y="392" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">主动排除：代理下拉(依赖 XIU2) · 回到顶部按钮(与启动器冲突)</text>

  <!-- L4 STATE -->
  <rect x="44" y="424" width="612" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="448" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L4 · STATE（状态：Settings 偏好 + NodeStore 节点）</text>
  <text x="220" y="444" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Settings 用户偏好唯一读写口（load/set 落盘）· NodeStore 镜像节点状态：fails 健康度 / lastOk 新鲜度</text>
  <text x="220" y="462" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Settings.enhance 持久化 · Enhancer._os/_arch 为临时覆盖（不落盘）</text>

  <!-- 外部数据源 -->
  <rect x="44" y="488" width="612" height="46" rx="10" fill="#FBFCFD" stroke="#9AA7B2" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="60" y="512" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#5A6470">外部数据源（脚本之外 · 非本脚本层 · 由 L3 网络层接入）</text>
  <text x="350" y="512" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5A6470">api.akams.cn/github　·　git.mxg.pub/api/github/list　·　内置镜像清单(接口全挂时并发测速兜底)</text>

  <!-- L3 NETWORK -->
  <rect x="44" y="544" width="612" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="568" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">L3 · NETWORK（网络 / 接口）</text>
  <text x="220" y="564" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">gmRequest 封装 · 双格式解析 parseAkams / parseMxg</text>
  <text x="220" y="582" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">节点源依次降级 · 接口全挂回落并发测速 · 8 路探测 · 下载量走 GitHub API</text>

  <!-- L2 FOUNDATION -->
  <rect x="44" y="608" width="612" height="94" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="60" y="632" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L2 · FOUNDATION（基础 / 工具 / 存储原语）</text>
  <text x="220" y="628" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Utils · Log · Store（存储原语）· Icons(内联 SVG)</text>
  <text x="220" y="646" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">SCENARIOS 场景规则 · DEFAULT_SETTINGS · K 常量 · NODES_APIS 双源</text>

  <!-- L2-b Arch (NEW) -->
  <rect x="174" y="656" width="456" height="40" rx="6" fill="#E1F5EE" stroke="#1B8A6B" stroke-width="1"/>
  <text x="190" y="672" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="600" fill="#085041">L2-b · FOUNDATION · Arch（★ 新增 纯函数 · 无 DOM 依赖）</text>
  <text x="190" y="689" dominant-baseline="central" font-family="sans-serif" font-size="10.5" fill="#0F6E56">parseFileArch / parseFileGroup / calculateMatchScore / getCurrentOS·Arch / getGroupClass·getTagClass / formatCount / isAuxiliaryFile / getRepoInfo　判定顺序：先 64 位后 32 位</text>

  <!-- L1 CONFIG -->
  <rect x="44" y="712" width="612" height="50" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="60" y="736" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">L1 · CONFIG（配置 / 常量 · 最底层 bedrock）</text>
  <text x="250" y="732" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">DEFAULT_SETTINGS（含 showPageButtons · enhance:ENHANCE_DEFAULT）</text>
  <text x="250" y="750" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">ENHANCE_DEFAULT = {groupSort, downloadCount, replaceTime, collapsibleNotes} · K · NODES_APIS 双源</text>

  <!-- 下载链路 -->
  <rect x="44" y="772" width="612" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="790" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">下载链路（纯直链 · 脚本不接管下载）</text>
  <text x="350" y="790" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">fresh 候选命中 → 0ms 直发浏览器；无 fresh → 短预检 2.5s；预检失败 → 换下一镜像；轮转耗尽 → 对最快节点直接放行</text>
  <g font-family="sans-serif">
    <rect x="60" y="800" width="128" height="42" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="124" y="816" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">① 挑选镜像</text>
    <text x="124" y="832" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">健康度排序 · 延迟优先</text>
    <rect x="210" y="800" width="128" height="42" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="274" y="816" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">② HEAD 预检</text>
    <text x="274" y="832" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">失败换下一镜像</text>
    <rect x="360" y="800" width="132" height="42" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="426" y="816" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">③ 原生直链</text>
    <text x="426" y="832" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">a[download] 点击触发</text>
    <rect x="514" y="800" width="128" height="42" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="578" y="816" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">④ 浏览器/Gopeed</text>
    <text x="578" y="832" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">原生通道接管下载</text>
    <path d="M188 821L204 821" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <path d="M338 821L352 821" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <path d="M492 821L506 821" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="341" y="861" text-anchor="middle" font-size="11" fill="#085041" font-weight="500">↑ 预检失败自动换下一个镜像（健康度记账）；轮转耗尽 → 对最快节点直接放行</text>
  </g>

  <!-- 职责边界 -->
  <rect x="44" y="862" width="612" height="92" rx="10" fill="#FBF5EA" stroke="#C58A2E" stroke-width="0.5"/>
  <text x="60" y="884" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#7A4A12">职责边界 · 三方各自管什么</text>
  <text x="60" y="904" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#7A4A12">脚本只管「发射」直链，下载事件由浏览器原生通道交给默认下载器或 Gopeed 浏览器扩展，脚本不接管下载。</text>
  <g font-family="sans-serif">
    <rect x="60" y="918" width="148" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="134" y="932" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">① 脚本（this）</text>
    <text x="134" y="946" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">挑镜像 · HEAD 预检 · a[download]</text>
    <path d="M208 932L250 932" fill="none" stroke="#C58A2E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="229" y="922" text-anchor="middle" font-size="11" fill="#7A4A12">原生点击</text>
    <rect x="252" y="918" width="172" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="338" y="932" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">② 浏览器原生通道</text>
    <text x="338" y="946" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">下载事件（chrome.downloads）</text>
    <path d="M424 932L466 932" fill="none" stroke="#C58A2E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="445" y="922" text-anchor="middle" font-size="11" fill="#7A4A12">拦截</text>
    <rect x="468" y="918" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#C58A2E" stroke-width="0.5"/>
    <text x="548" y="932" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#7A4A12">③ Gopeed 浏览器扩展</text>
    <text x="548" y="946" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7A4A12">chrome.downloads 拦截后接管</text>
  </g>

  <!-- v1.0.0 新增能力说明 -->
  <rect x="44" y="964" width="612" height="64" rx="10" fill="#F4F0FF" stroke="#6B4FB0" stroke-width="0.5"/>
  <text x="60" y="984" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A2F8A">v1.0.0 新增能力（Release 增强显示）</text>
  <text x="60" y="1002" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#4A2F8A">四类核心能力 → 纯计算并入 L2-b Arch，DOM 编排并入 L5-c Enhancer；</text>
  <text x="60" y="1018" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#4A2F8A">排除与加速主流程冲突/冗余项（代理下拉、回到顶部按钮），全部能力可独立开关并持久化于 Settings.enhance。</text>
</svg>
