<svg viewBox="0 0 680 1050" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .layer { fill: none; stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .layer-title { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
      .node { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .nt { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .nd { font-family: sans-serif; font-size: 10.5px; fill: #64748b; }
      .arrow { stroke: #94a3b8; stroke-width: 1.3; fill: none; }
      .band { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .band-t { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #047857; }
      .band-d { font-family: sans-serif; font-size: 11px; fill: #10b981; }
      .warn { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .warn-t { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #92400e; }
      .warn-d { font-family: sans-serif; font-size: 10.5px; fill: #b45309; }
      .new { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; }
      .new-t { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #1d4ed8; }
      .new-d { font-family: sans-serif; font-size: 10.5px; fill: #2563eb; }
      .mute { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .mute-t { font-family: sans-serif; font-size: 12.5px; font-weight: 600; fill: #64748b; }
      .mute-d { font-family: sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .note { font-family: sans-serif; font-size: 11px; fill: #475569; }
      .tag { font-family: sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
      .h1 { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .h2 { font-family: sans-serif; font-size: 11.5px; fill: #64748b; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="24" y="26" class="h1">jump-hub v1.3.4 · 全站链接直跳助手 · 六层架构</text>
  <text x="24" y="45" class="h2">通用识别是主干，站点规则只是加速 —— 没适配过的站点同样能识别；零注入，网盘终点站收手</text>

  <!-- ① 触发层 -->
  <rect x="24" y="60" width="632" height="132" rx="12" class="layer"/>
  <text x="40" y="82" class="layer-title">① 触发层 · 谁发现链接</text>

  <rect x="40" y="94" width="142" height="80" rx="8" class="node"/>
  <text x="111" y="116" class="nt" text-anchor="middle">首屏扫描</text>
  <text x="111" y="136" class="nd" text-anchor="middle">DOMContentLoaded</text>
  <text x="111" y="152" class="nd" text-anchor="middle">deepScan 全量</text>
  <text x="111" y="167" class="nd" text-anchor="middle">静态页面一次搞定</text>

  <rect x="192" y="94" width="150" height="80" rx="8" class="new"/>
  <text x="267" y="116" class="new-t" text-anchor="middle">增量扫描</text>
  <text x="267" y="136" class="new-d" text-anchor="middle">MutationObserver</text>
  <text x="267" y="152" class="new-d" text-anchor="middle">只扫新增子树</text>
  <text x="267" y="167" class="new-d" text-anchor="middle">水合 / 懒加载不再漏</text>

  <rect x="352" y="94" width="142" height="80" rx="8" class="node"/>
  <text x="423" y="116" class="nt" text-anchor="middle">点击捕获</text>
  <text x="423" y="136" class="nd" text-anchor="middle">composedPath</text>
  <text x="423" y="152" class="nd" text-anchor="middle">兜底最后一道</text>
  <text x="423" y="167" class="nd" text-anchor="middle">不因 defaultPrevented 放弃</text>

  <rect x="504" y="94" width="136" height="80" rx="8" class="node"/>
  <text x="572" y="116" class="nt" text-anchor="middle">window.open 包装</text>
  <text x="572" y="136" class="nd" text-anchor="middle">脚本开窗同样接管</text>
  <text x="572" y="152" class="nd" text-anchor="middle">SPA 路由兜底</text>
  <text x="572" y="167" class="nd" text-anchor="middle">原生 API 不变形</text>

  <line x1="340" y1="192" x2="340" y2="212" class="arrow" marker-end="url(#ar)"/>

  <!-- ② 解析与判定层 -->
  <rect x="24" y="216" width="632" height="170" rx="12" class="layer"/>
  <text x="40" y="238" class="layer-title">② 解析与判定层 · 安全第一</text>

  <rect x="40" y="250" width="192" height="66" rx="8" class="band"/>
  <text x="136" y="272" class="band-t" text-anchor="middle">通用参数解析（主干）</text>
  <text x="136" y="292" class="band-d" text-anchor="middle">强参数 16 · 弱参数 40</text>
  <text x="136" y="307" class="band-d" text-anchor="middle">不依赖任何站点名单</text>

  <rect x="244" y="250" width="192" height="66" rx="8" class="node"/>
  <text x="340" y="272" class="nt" text-anchor="middle">多层解码 + 幂等回溯</text>
  <text x="340" y="292" class="nd" text-anchor="middle">base64 / hex / 路径内嵌 / 文本直链</text>
  <text x="340" y="307" class="nd" text-anchor="middle">已是目标地址则原样返回</text>

  <rect x="448" y="250" width="192" height="66" rx="8" class="node"/>
  <text x="544" y="272" class="nt" text-anchor="middle">弱参数门控</text>
  <text x="544" y="292" class="nd" text-anchor="middle">redirect_uri 等只在</text>
  <text x="544" y="307" class="nd" text-anchor="middle">路径像跳转页时才采信</text>

  <rect x="40" y="328" width="600" height="48" rx="8" class="warn"/>
  <text x="340" y="347" class="warn-t" text-anchor="middle">护栏：同主机 / 同注册域一律不动</text>
  <text x="340" y="365" class="warn-d" text-anchor="middle">百度结果里指向 baike.baidu.com 的不算外链 · OAuth 授权链不受影响</text>

  <line x1="340" y1="386" x2="340" y2="406" class="arrow" marker-end="url(#ar)"/>

  <!-- ③ 执行层 -->
  <rect x="24" y="410" width="632" height="126" rx="12" class="layer"/>
  <text x="40" y="432" class="layer-title">③ 执行层 · 怎么跳</text>

  <rect x="40" y="444" width="192" height="80" rx="8" class="node"/>
  <text x="136" y="466" class="nt" text-anchor="middle">改写 href（首选）</text>
  <text x="136" y="486" class="nd" text-anchor="middle">中键 / 右键同样生效</text>
  <text x="136" y="502" class="nd" text-anchor="middle">落 data-jh-to 标记</text>
  <text x="136" y="517" class="nd" text-anchor="middle">保留原生右键菜单</text>

  <rect x="244" y="444" width="192" height="80" rx="8" class="node"/>
  <text x="340" y="466" class="nt" text-anchor="middle">点击拦截（兜底）</text>
  <text x="340" y="486" class="nd" text-anchor="middle">防站点处理器把点击拉回</text>
  <text x="340" y="502" class="nd" text-anchor="middle">自己合成的链接由 bypass</text>
  <text x="340" y="517" class="nd" text-anchor="middle">标记挡掉，不自拦</text>

  <rect x="448" y="444" width="192" height="80" rx="8" class="node"/>
  <text x="544" y="466" class="nt" text-anchor="middle">新标签打开</text>
  <text x="544" y="486" class="nd" text-anchor="middle">window.open 优先</text>
  <text x="544" y="502" class="nd" text-anchor="middle">被拦则合成 a 标签点它</text>
  <text x="544" y="517" class="nd" text-anchor="middle">带 rel=noopener</text>

  <line x1="340" y1="536" x2="340" y2="556" class="arrow" marker-end="url(#ar)"/>

  <!-- ④ 网盘增强层 -->
  <rect x="24" y="560" width="632" height="170" rx="12" class="layer"/>
  <text x="40" y="582" class="layer-title">④ 网盘增强层 · 提取码归属（v1.3.0 重点加固）</text>

  <rect x="40" y="594" width="192" height="66" rx="8" class="new"/>
  <text x="136" y="616" class="new-t" text-anchor="middle">归属判定</text>
  <text x="136" y="636" class="new-d" text-anchor="middle">容器里出现别的网盘</text>
  <text x="136" y="651" class="new-d" text-anchor="middle">链接 → 立即停止爬升</text>

  <rect x="244" y="594" width="192" height="66" rx="8" class="node"/>
  <text x="340" y="616" class="nt" text-anchor="middle">就近取码 ≤ 4 层</text>
  <text x="340" y="636" class="nd" text-anchor="middle">容器 &gt; 420 字即放弃</text>
  <text x="340" y="651" class="nd" text-anchor="middle">整页唯一才兜底</text>

  <rect x="448" y="594" width="192" height="66" rx="8" class="node"/>
  <text x="544" y="616" class="nt" text-anchor="middle">落地自动填码</text>
  <text x="544" y="636" class="nd" text-anchor="middle">21 家网盘适配</text>
  <text x="544" y="651" class="nd" text-anchor="middle">填完提交，全程无感</text>

  <rect x="40" y="672" width="600" height="48" rx="8" class="warn"/>
  <text x="340" y="691" class="warn-t" text-anchor="middle">宁可不动，不可错动：多个不同码 + 就近找不到 → 什么都不做</text>
  <text x="340" y="709" class="warn-d" text-anchor="middle">拉丁标签必须带 : 或 = 且不收 key · 只加 query 不动 hash（免得毁掉 hash 路由）</text>

  <line x1="340" y1="730" x2="340" y2="750" class="arrow" marker-end="url(#ar)"/>

  <!-- ⑤ 站点规则层 -->
  <rect x="24" y="754" width="632" height="112" rx="12" class="layer"/>
  <text x="40" y="776" class="layer-title">⑤ 站点规则层 · 增强而非必需</text>

  <rect x="40" y="788" width="292" height="62" rx="8" class="mute"/>
  <text x="186" y="810" class="mute-t" text-anchor="middle">49 条规则（可选加速）</text>
  <text x="186" y="830" class="mute-d" text-anchor="middle">rewrite / jump / absorb</text>

  <rect x="348" y="788" width="292" height="62" rx="8" class="mute"/>
  <text x="494" y="808" class="mute-t" text-anchor="middle">没命中也照常工作</text>
  <text x="494" y="830" class="mute-d" text-anchor="middle">两条路收敛到同一个 resolveLink()</text>

  <line x1="340" y1="866" x2="340" y2="888" class="arrow" marker-end="url(#ar)"/>

  <!-- ⑥ 入口 · 零注入（v1.3.4 裁决：就单纯跳转功能） -->
  <rect x="24" y="888" width="632" height="118" rx="12" class="layer"/>
  <text x="40" y="910" class="layer-title">⑥ 入口 · 零注入（v1.3.4 裁决）</text>

  <rect x="40" y="922" width="292" height="70" rx="8" class="warn"/>
  <text x="186" y="948" class="warn-t" text-anchor="middle">不往页面注入任何东西</text>
  <text x="186" y="968" class="warn-d" text-anchor="middle">无按钮 · 无悬浮 · 无快捷键</text>

  <rect x="348" y="922" width="292" height="70" rx="8" class="node"/>
  <text x="494" y="948" class="nt" text-anchor="middle">管理器菜单是唯一入口</text>
  <text x="494" y="968" class="nd" text-anchor="middle">打开面板 / 重新扫描 / 重置统计</text>

  <!-- 图例 -->
  <rect x="24" y="1018" width="632" height="1" fill="#e2e8f0"/>
  <rect x="24" y="1026" width="11" height="11" rx="3" class="new"/>
  <text x="42" y="1036" class="note">v1.3.x 新增 / 重做</text>
  <rect x="156" y="1026" width="11" height="11" rx="3" class="node"/>
  <text x="174" y="1036" class="note">沿用（v1.2.0）</text>
  <rect x="274" y="1026" width="11" height="11" rx="3" class="warn"/>
  <text x="292" y="1036" class="note">准确率护栏</text>
  <rect x="380" y="1026" width="11" height="11" rx="3" class="mute"/>
  <text x="398" y="1036" class="note">增强层（可缺省）</text>
  <text x="506" y="1036" class="note">测试 226 冒烟 / 146 端到端</text>
</svg>
