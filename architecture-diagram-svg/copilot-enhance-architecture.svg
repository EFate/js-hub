<rect x="40" y="336" width="196" height="62" rx="8" class="b"/><text x="138" y="356" class="bt" text-anchor="middle">patchRegionData</text><text x="138" y="374" class="bd" text-anchor="middle">region/eligibility</text><text x="138" y="389" class="bd" text-anchor="middle">country/idempotent</text>
<rect x="248" y="336" width="196" height="62" rx="8" class="n"/><text x="346" y="356" class="t" text-anchor="middle">JSON hook</text><text x="346" y="374" class="d" text-anchor="middle">installRegion</text><text x="346" y="389" class="d" text-anchor="middle">hydration</text>
