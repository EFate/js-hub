<rect x="338" y="744" width="302" height="44" rx="8" class="b"/><text x="489" y="763" class="bt" text-anchor="middle">Status</text><text x="489" y="779" class="bd" text-anchor="middle">region count · upload count</text>
<line x1="340" y1="804" x2="340" y2="824" class="arrow" marker-end="url(#ar)"/>
<rect x="24" y="828" width="632" height="92" rx="12" class="layer"/><text x="40" y="850" class="lt">L7 Watcher 层 · 唯一监听者</text>
<rect x="40" y="860" width="286" height="44" rx="8" class="n"/><text x="183" y="879" class="t" text-anchor="middle">MutationObserver</text><text x="183" y="895" class="d" text-anchor="middle">DOM poll / retry heal</text>
<rect x="338" y="860" width="302" height="44" rx="8" class="n"/><text x="489" y="879" class="t" text-anchor="middle">Document start</text><text x="489" y="895" class="d" text-anchor="middle">JSON.parse hook early</text>
<rect x="24" y="936" width="632" height="52" rx="12" class="w"/><text x="40" y="956" class="wt">边界</text><text x="40" y="976" class="wd">Client-side config rewrite cannot change real IP; server-side geo rejection still needs a supported network route.</text>
