<svg viewBox="0 0 680 1000" xmlns="http://www.w3.org/2000/svg">
<defs><style>.layer{fill:none;stroke:#e2e8f0;stroke-width:1.2;stroke-dasharray:4 3}.lt{font-family:sans-serif;font-size:13px;font-weight:600;fill:#64748b}.n{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.b{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.t{font-family:sans-serif;font-size:12.5px;font-weight:600;fill:#1e293b}.d{font-family:sans-serif;font-size:10.5px;fill:#64748b}.bt{font-family:sans-serif;font-size:12.5px;font-weight:700;fill:#047857}.bd{font-family:sans-serif;font-size:10.5px;fill:#10b981}.h1{font-family:sans-serif;font-size:15px;font-weight:700;fill:#0f172a}.h2{font-family:sans-serif;font-size:11.5px;fill:#64748b}.w{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}.wt{font-family:sans-serif;font-size:12.5px;font-weight:600;fill:#92400e}.wd{font-family:sans-serif;font-size:10.5px;fill:#b45309}.arrow{stroke:#94a3b8;stroke-width:1.3;fill:none}</style><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="26" class="h1">copilot-enhance v1.2.4 · Copilot 增强助手 · 七层架构</text>
<text x="24" y="45" class="h2">地区解锁 + 上传增强 · 零依赖 · 零注入 · 3 开关 / 2 组</text>
<rect x="24" y="60" width="632" height="104" rx="12" class="layer"/><text x="40" y="82" class="lt">L1 配置层 · Meta / OPT_DEFS / 站点</text>
<rect x="40" y="94" width="186" height="54" rx="8" class="n"/><text x="133" y="115" class="t" text-anchor="middle">UserScript Meta</text><text x="133" y="133" class="d" text-anchor="middle">version/author</text>
<rect x="238" y="94" width="186" height="54" rx="8" class="b"/><text x="331" y="115" class="bt" text-anchor="middle">OPT_DEFS 3</text><text x="331" y="133" class="bd" text-anchor="middle">地区 1 · 上传 2</text>
<rect x="436" y="94" width="204" height="54" rx="8" class="n"/><text x="538" y="115" class="t" text-anchor="middle">Match + Menu</text><text x="538" y="133" class="d" text-anchor="middle">copilot.com · GM menu</text>
